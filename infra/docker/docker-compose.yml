# Local development services only. Production runs on managed
# services (Render Postgres, Render Redis) — this file exists purely
# so engineers don't need Postgres/Redis installed on the host.
#
# Host ports are remapped (5433, 6380) to avoid colliding with other
# projects' containers that may already be running on this machine
# using the standard 5432/6379 ports.
#
# Usage: docker compose -f infra/docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: booksphere
      POSTGRES_PASSWORD: booksphere
      POSTGRES_DB: booksphere_dev
    ports:
      - "5433:5432"
    volumes:
      - booksphere_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  booksphere_pg_data:
